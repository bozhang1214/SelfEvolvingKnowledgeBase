# ============================================================
# Nginx 生产配置 - 前端容器托管 + 后端反向代理 + HTTPS
# ============================================================
# 部署方式：
#   - 将此文件挂载到前端容器 /etc/nginx/conf.d/default.conf
#   - 前端容器同时承担：托管 SPA 静态资源 + 反向代理 /api 到后端 + HTTPS 终结
# SSL 证书：Let's Encrypt（certbot 签发在宿主机，只读挂载到容器）
# ============================================================

# 限流 zone 定义：按客户端 IP 限流，保护后端
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# 被限流时的状态码：**必须是 429**，不能是 nginx 默认的 503。
# 503 会被前端显示成「服务不可用」（像是服务挂了），而 429 前端有专门文案
# 「请求过于频繁，请稍后再试」并会自动重试一次；两者用户看到的结论完全不同。
limit_req_status 429;

# 客户端事件上报专用限流（防滥用，更严格）
# 默认 2r/s + burst 10，单客户端 5s 内最多 20 条事件（前端批量 flush 周期 5s）
limit_req_zone $binary_remote_addr zone=client_event_limit:10m rate=2r/s;
# 科技资讯页专用：切 tab 会瞬时发「列表+详情」多个请求，用共享的 api_limit（10r/s）
# 很容易被打成 429（实测 25 次 429，含 POST /news/refresh 被限流 → 用户看到「生成失败」）。
# 单独给一条更宽的配额，避免资讯页把**全站** API 配额打满。
limit_req_zone $binary_remote_addr zone=news_limit:10m rate=30r/s;

# 上游后端服务（与 docker-compose 服务名一致）
upstream sekb_backend {
    server backend:8000;
    # 健康检查被动模式：失败 3 次剔除 30 秒
    keepalive 32;
}

# JobCopilot MCP Server（HTTP/SSE，供云端平台调用）。
# ⚠️ 这个容器必须在 nginx 启动**之前**就存在，否则 nginx 解析不到该名字会启动失败
#    —— deploy.sh 里是「先起 jobcopilot-mcp、再起 frontend」的顺序。
upstream sekb_jobcopilot_mcp {
    server jobcopilot-mcp:8765;
    keepalive 16;
}

# 结构化日志格式，便于 Loki/ELK 采集（http 上下文级，不可置于 server 块内）
log_format sekb_main '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'rt=$request_time uct="$upstream_connect_time" '
                     'urt="$upstream_response_time"';

# ============================================================
# HTTP (80)：仅用于 ACME challenge 续签 + 跳转 HTTPS
# ============================================================
server {
    listen 80;
    server_name _;

    # ACME challenge（Let's Encrypt 证书签发/续签，certbot webroot 写入）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # 其余请求一律跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# HTTPS (443)：应用
# ============================================================
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # SSL 证书（Let's Encrypt）
    ssl_certificate /etc/letsencrypt/live/bos-studio.tech-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bos-studio.tech-0001/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 安全头：基础防护
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 生产环境启用 HSTS（仅在 HTTPS 下生效）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 内容安全策略：限制资源加载来源，防 XSS
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    # 权限策略：禁用不必要的浏览器特性
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # gzip 压缩：减小传输体积，加速首屏
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ---------- 前端 SPA 静态资源（部署在 /sekb/ 子路径，与其他应用区分） ----------
    root /usr/share/nginx/html;
    index index.html;

    # 根路径：不跳转，展示服务目录占位页（避免与其他应用冲突/混淆）
    # 必须通过 /sekb/ 路径访问知识库
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
    location = /sekb {
        return 301 /sekb/;
    }

    # ============ JobCopilot 提示词分发（自建主源） ============
    # 供 `jobcopilot pull --remote` 拉取；内容由 jobcopilot publish 生成（含 sha256 校验）。
    # 隐私：提示词是公开内容，但仍关掉访问日志——少一份可用于画像的访问记录。
    location /prompts/ {
        alias /var/www/jobcopilot-prompts/;
        access_log off;
        autoindex off;                      # 不列目录，只按 manifest.json 取文件
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff" always;
        types { }
        default_type text/plain;            # 一律按纯文本返回，避免浏览器解析
    }

    # ---------- JobCopilot MCP（云端平台接入）----------
    # 对外地址：https://<域名>/jobcopilot/mcp（streamable HTTP）
    #           https://<域名>/jobcopilot/sse（SSE，百度千帆只支持这条）
    location /jobcopilot/ {
        limit_req zone=api_limit burst=20 nodelay;

        # ⚠️ 刻意**不带 URI**（写成 http://host 而不是 http://host/xxx）：
        #    nginx 会把原始路径原样透传，于是内核看到的是 /jobcopilot/mcp。
        #    这点很关键——SSE 会把「消息端点」作为绝对路径告诉客户端，
        #    内核要知道前缀才能写成 /jobcopilot/sse/messages/，否则客户端请求错地址。
        #    （容器里已设 JOBCOPILOT_HTTP_BASE_PATH=/jobcopilot 与此对应。）
        proxy_pass http://sekb_jobcopilot_mcp;
        proxy_http_version 1.1;

        # Host 必须是**对外域名**：内核用它做 Host 白名单校验
        # （JOBCOPILOT_HTTP_ALLOWED_HOSTS），不匹配会返回 421
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---------- SSE / 流式响应关键配置 ----------
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;            # 批量分析耗时长，别用默认 60s
        proxy_send_timeout 300s;
        proxy_set_header Connection "";
        gzip off;
        proxy_pass_header Content-Type;
        proxy_pass_header Cache-Control;
        proxy_pass_header X-Accel-Buffering;
    }

    # SPA 路由回退：/sekb/ 下所有非文件请求回退到 /sekb/index.html（react-router history 模式）
    location /sekb/ {
        try_files $uri $uri/ /sekb/index.html;
    }

    # 静态资源缓存策略：带 hash 的资源 1 年强缓存
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # 带指纹的资源内容变化会改变文件名，可安全长缓存
        access_log off;
    }

    # index.html 禁止缓存，保证发布后用户立即拿到新版本
    location = /sekb/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # ---------- 后端 API 反向代理（/sekb/api/ 前缀剥离后转发到后端 /api/） ----------
    # 科技资讯接口：更宽的限流（见上面 news_limit 的说明）
    location /sekb/api/v1/news/ {
        limit_req zone=news_limit burst=60 nodelay;

        proxy_pass http://sekb_backend/api/v1/news/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 生成类接口提交即返回（后端已改异步），但**读报告**可能较大，超时给足
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection "";
        gzip off;
    }

    location /sekb/api/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://sekb_backend/api/;
        proxy_http_version 1.1;

        # 透传客户端信息给后端
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---------- SSE 流式响应关键配置 ----------
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection "";
        gzip off;
        proxy_pass_header Content-Type;
        proxy_pass_header Cache-Control;
        proxy_pass_header X-Accel-Buffering;
    }

    # ---------- 客户端事件上报（独立限流，更严格） ----------
    location = /sekb/api/v1/monitoring/client-event {
        limit_req zone=client_event_limit burst=10 nodelay;

        proxy_pass http://sekb_backend/api/v1/monitoring/client-event;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上报请求体限制 64KB（单批最多 50 事件，足够）
        client_max_body_size 64k;
    }

    # ---------- 健康检查端点（独立路由，不限流）----------
    location = /sekb/health {
        proxy_pass http://sekb_backend/api/v1/health/live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---------- 文件上传体积限制 ----------
    client_max_body_size 50m;

    # ---------- 安全：隐藏 nginx 版本 ----------
    server_tokens off;

    # ---------- 日志：使用顶层定义的 sekb_main 格式 ----------
    access_log /var/log/nginx/access.log sekb_main;
    error_log /var/log/nginx/error.log warn;
}
