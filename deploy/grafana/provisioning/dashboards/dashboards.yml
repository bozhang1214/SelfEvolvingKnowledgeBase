# ============================================================
# Grafana 看板自动 provisioning
# ============================================================
# 挂载到 grafana 容器 /etc/grafana/provisioning/dashboards/dashboards.yml
# 启动时自动加载 deploy/grafana/provisioning/dashboards/*.json
# ============================================================

apiVersion: 1

providers:
  - name: "SEKB Dashboards"
    orgId: 1
    folder: "SEKB"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
