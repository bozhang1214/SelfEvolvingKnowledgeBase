# ============================================================
# Grafana 数据源自动 provisioning
# ============================================================
# 挂载到 grafana 容器 /etc/grafana/provisioning/datasources/datasources.yml
# 启动时自动配置 Prometheus 与 Loki 数据源，无需手动添加
# ============================================================

apiVersion: 1

datasources:
  # ---------- Prometheus（指标数据源） ----------
  - name: Prometheus
    type: prometheus
    # 固定 uid：看板面板以 uid=prometheus 引用（见 sekb-overview.json）
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  # ---------- Loki（日志数据源） ----------
  - name: Loki
    type: loki
    # 固定 uid：供日志看板/Explore 引用
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
