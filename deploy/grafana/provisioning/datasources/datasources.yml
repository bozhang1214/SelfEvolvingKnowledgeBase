# ============================================================
# Grafana 数据源自动 provisioning
# ============================================================
# 挂载到 grafana 容器 /etc/grafana/provisioning/datasources/datasources.yml
# 启动时自动配置 Prometheus 与 Loki 数据源，无需手动添加
# ============================================================

apiVersion: 1

datasources:
  # ---------- Prometheus（指标数据源） ----------
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  # ---------- Loki（日志数据源） ----------
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
