# ============================================================
# Nginx 灰度发布配置（Phase 4 P0-7）
# ============================================================
# 替换 deploy/nginx.conf 使用，通过 split_clients 按比例分流到稳定版/灰度版后端
#
# 使用方式：
#   1. 启动灰度版后端容器（容器名 backend-canary，端口 8001）
#   2. 切换前端 nginx 配置：
#        cp deploy/nginx-canary.conf deploy/nginx.conf
#      或在 docker-compose 中挂载本文件
#   3. 通过环境变量 CANARY_PERCENTAGE 调整灰度比例（0-100）
#   4. 运行 canary_monitor.sh 监控灰度健康，自动回滚
# ============================================================

# 限流 zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# ---------- 灰度分流模块 ----------
# 按 % 基于客户端 IP 哈希分流（同一用户始终走同一版本，避免会话错乱）
# 预生成 1000 个槽位，CANARY_PERCENTAGE 个分配给灰度上游
# 默认 10% 灰度，可通过修改 0..1 边界调整
split_clients "${remote_addr}${http_user_agent}" $backend_upstream {
    10%  backend_canary;
    *   backend_stable;
}

# 稳定版上游
upstream backend_stable {
    server backend:8000;
    keepalive 32;
}

# 灰度版上游（端口 8001）
upstream backend_canary {
    server backend-canary:8001;
    keepalive 8;
}

# 结构化日志
log_format sekb_main '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'rt=$request_time uct="$upstream_connect_time" '
                     'urt="$upstream_response_time" '
                     'upstream=$upstream_addr';

server {
    listen 80;
    server_name _;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;

    # ---------- 前端 SPA ----------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------- 后端 API 灰度分流 ----------
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        # 使用 split_clients 分流
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 标记灰度版本（供后端日志区分）
        proxy_set_header X-Canary $backend_upstream;

        # SSE 流式响应
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection "";
        gzip off;
        proxy_pass_header Content-Type;
        proxy_pass_header Cache-Control;
        proxy_pass_header X-Accel-Buffering;
    }

    # ---------- 灰度健康检查端点 ----------
    # /canary-health 直接查询灰度上游，避免被分流到稳定版
    location = /canary-health {
        proxy_pass http://backend_canary/api/v1/health/live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---------- 主健康检查 ----------
    location = /health {
        proxy_pass http://backend_stable/api/v1/health/live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    client_max_body_size 10m;
    server_tokens off;

    access_log /var/log/nginx/access.log sekb_main;
    error_log /var/log/nginx/error.log warn;
}
