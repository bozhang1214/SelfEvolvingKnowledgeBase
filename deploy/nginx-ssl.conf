# ============================================================
# Nginx HTTPS 配置模板（Phase 4 P0-9 安全加固）
# ============================================================
# 用于生产环境启用 SSL/TLS，配合 Let's Encrypt 证书
#
# 使用方式：
#   1. 申请证书（Let's Encrypt 或商业证书）：
#        certbot certonly --standalone -d your-domain.com
#   2. 将证书路径配置到下方 ssl_certificate
#   3. 替换 deploy/nginx.conf 使用，或在独立 Nginx 容器中挂载
#   4. 启用 HTTP → HTTPS 自动跳转
#
# 与 deploy/nginx.conf 的区别：
#   - 增加 SSL 证书配置
#   - 强制 HTTPS 跳转
#   - 启用 HTTP/2 提升性能
#   - 更严格的 TLS 版本与加密套件
# ============================================================

# 限流 zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# 上游后端
upstream sekb_backend {
    server backend:8000;
    keepalive 32;
}

log_format sekb_main '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'rt=$request_time uct="$upstream_connect_time" '
                     'urt="$upstream_response_time"';

# ---------- HTTP → HTTPS 跳转 ----------
server {
    listen 80;
    server_name _;
    # 永久跳转到 HTTPS
    return 301 https://$host$request_uri;
}

# ---------- HTTPS 主服务 ----------
server {
    listen 443 ssl http2;
    server_name _;

    # ---------- SSL 证书 ----------
    # Let's Encrypt 证书路径（请根据实际域名调整）
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # ---------- TLS 安全配置 ----------
    # 仅允许 TLS 1.2+（禁用不安全的旧版本）
    ssl_protocols TLSv1.2 TLSv1.3;
    # 优先使用服务端加密套件（前向保密）
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP Stapling（加速证书验证）
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---------- 安全头 ----------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;

    # ---------- 前端 SPA ----------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------- 后端 API 反代 ----------
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://sekb_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # SSE 流式响应
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection "";
        gzip off;
        proxy_pass_header Content-Type;
        proxy_pass_header Cache-Control;
        proxy_pass_header X-Accel-Buffering;
    }

    location = /health {
        proxy_pass http://sekb_backend/api/v1/health/live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    client_max_body_size 10m;
    server_tokens off;

    access_log /var/log/nginx/access.log sekb_main;
    error_log /var/log/nginx/error.log warn;
}
