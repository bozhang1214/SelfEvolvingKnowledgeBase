# ============================================================
# 自迭代个人知识库 Agent 配置文件
# ============================================================
# 使用说明：
#   1. 修改配置后需重启服务生效（Phase 1 不支持热加载）
#   2. 敏感信息（API Key 等）请通过 ${ENV_VAR} 引用环境变量
#   3. 详细字段说明见 docs/04-config-reference.md
# ============================================================

# ============ 应用元信息 ============
app:
  name: self-evolving-kb
  version: 0.1.0
  environment: development
  debug: true

# ============ LLM 模型路由 ============
llm:
  provider: deepseek
  api_key: ${DEEPSEEK_API_KEY}
  base_url: https://api.deepseek.com/v1
  timeout_seconds: 60
  max_retries: 2
  retry_backoff_seconds: [1, 2]

  roles:
    supervisor:
      model: deepseek-chat
      temperature: 0.1
      max_tokens: 500
      response_format: json
    planner:
      model: deepseek-reasoner
      temperature: 0.2
      max_tokens: 2000
      response_format: json
    executor:
      model: deepseek-chat
      temperature: 0.3
      max_tokens: 2000
    critic:
      model: deepseek-chat
      temperature: 0.0
      max_tokens: 1000
      response_format: json
    critic_complex:
      model: deepseek-reasoner
      temperature: 0.0
      max_tokens: 2000
      response_format: json
    scribe:
      model: deepseek-chat
      temperature: 0.2
      max_tokens: 800
      response_format: json
    chat_simple:
      model: deepseek-chat
      temperature: 0.7
      max_tokens: 1000

  fallback:
    reasoner_to_chat: true
    chat_to_error: true

# ============ 意图路由 ============
intent_routing:
  default_intent: web_default
  clarify_threshold: 0.7
  kb_strict_keywords:
    - "我的笔记"
    - "知识库"
    - "我之前说过"
    - "基于我的"
    - "根据我的文档"
  kb_prefer_hit_threshold: 0.85
  realtime_keywords:
    - "最新"
    - "今天"
    - "昨天"
    - "今年"
    - "2026"
    - "当前"
  enable_pre_retrieval: true
  pre_retrieval_top_k: 3

# ============ 三层记忆 ============
memory:
  l1_working:
    enabled: true
    max_turns: 8
    max_tokens: 3000
    hard_token_limit: 4000
    compress_strategy: hierarchical
    max_compressed_summaries: 3
  l2_session:
    enabled: false
    max_items: 50
    eviction: lru
  l3_knowledge:
    enabled: false
    retrieval_top_k: 5
    importance_threshold: 0.3
    eviction:
      max_items: 10000
      stale_days: 7
      similarity_merge_threshold: 0.95

# ============ 反思策略 ============
reflection:
  policy: always
  max_replan: 2
  model_switch_threshold: 0.7
  adaptive:
    skip_if_rag_hit_above: 0.95
    skip_if_intent_in: [chitchat]
  sampling:
    rate: 0.5

# ============ 评估指标阈值 ============
evaluation:
  enabled: true
  log_to_file: true
  log_path: data/eval_logs
  metrics:
    intent_confidence:
      good: 0.9
      warn: 0.7
    plan_step_count:
      good: 5
      warn: 8
    replan_count:
      good: 0
      warn: 2
    tool_success_rate:
      good: 0.9
      warn: 0.7
    answer_groundedness:
      good: 0.8
      warn: 0.6
    critic_coherence_score:
      good: 8.0
      warn: 6.0
    answer_relevance:
      good: 0.8
      warn: 0.6
    e2e_latency_ms:
      good: 5000
      warn: 10000
  regression:
    pass_rate_drop_threshold: 0.05
    metric_drop_threshold: 0.05

# ============ 成本控制 ============
cost_control:
  per_conversation_token_limit: 20000
  daily_budget_usd: 1.0
  reasoner_ratio_alert_above: 0.3
  auto_downgrade_on_budget: true
  pricing:
    deepseek-chat:
      input: 0.00014
      output: 0.00028
    deepseek-reasoner:
      input: 0.00055
      output: 0.00219

# ============ Tracing ============
tracing:
  provider: langsmith
  fallback_to_local_on_failure: true
  sample_rate: 1.0
  langsmith:
    api_key: ${LANGSMITH_API_KEY}
    project: self-evolving-kb
    endpoint: https://api.smith.langchain.com
  local_json:
    trace_dir: data/traces
    max_file_size_mb: 10

# ============ 工具层（MCP 协议） ============
tools:
  web_search:
    provider: bocha
    api_key: ${BOCHA_API_KEY}
    endpoint: https://api.bochaai.com/v1/web-search
    max_results: 5
    timeout_seconds: 10
    max_retries: 2
  filesystem:
    enabled: false
    allowed_paths: []
  vector_store:
    enabled: false
    provider: chroma
    persist_path: data/chroma_db
  document_parser:
    enabled: false

# ============ 存储后端 ============
storage:
  backend: local_json
  conversations_dir: data/conversations
  index_file: data/index.json
  postgres:
    url: ${DATABASE_URL}
    pool_size: 10

# ============ 安全 ============
security:
  pii_masking: true
  prompt_injection_guard: true
  max_input_length: 8000
  blocked_patterns:
    - "ignore.*previous.*instruction"
    - "disregard.*above"

# ============ API 服务 ============
api:
  host: 0.0.0.0
  port: 8000
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
  rate_limit:
    enabled: false
    requests_per_minute: 60

# ============ 日志 ============
logging:
  level: INFO
  format: json
  log_dir: data/logs
  max_file_size_mb: 50
  backup_count: 7
  redact_fields:
    - api_key
    - authorization
    - token
