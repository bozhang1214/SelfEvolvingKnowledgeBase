# JVM 参数：Compose + AGP 9 在默认堆上偶尔 OOM（本机实测 2g 够用）
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin 编译走**进程内**而不是独立 daemon。
# 原因：Kotlin daemon 会在仓库外另建状态（且实测在某些环境下起不来，
# Gradle 会打印 "Using fallback strategy: Compile without Kotlin daemon"）。
# 显式选进程内 = 行为确定 + 不在仓库外写文件；代价是增量编译稍慢。
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
