# ============================================================
# 自迭代个人知识库 Agent - 生产环境一键部署
# ============================================================
# 使用方式：
#   1. 复制 deploy/.env.prod.example 为 .env.prod 并填入真实密钥
#   2. 启动核心服务（后端 + 前端）：
#        docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#   3. 启动全部服务（含数据库，Phase 2 迁移后启用）：
#        docker compose -f docker-compose.prod.yml --env-file .env.prod \
#          --profile with-db up -d
#   4. 查看日志：
#        docker compose -f docker-compose.prod.yml logs -f backend
#   5. 停止并清理：
#        docker compose -f docker-compose.prod.yml down
#
# 服务拓扑：
#   ┌──────────────┐    /api/*   ┌──────────────┐
#   │   frontend   │ ──────────▶ │   backend    │
#   │ (nginx+SPA)  │             │  (FastAPI)   │
#   │   :80        │             │   :8000      │
#   └──────────────┘             └──────┬───────┘
#                                        │ data 卷持久化
#                                        ▼
#                                 ┌──────────────┐
#                                 │  sekb_data   │
#                                 │  (volume)    │
#                                 └──────────────┘
#   可选 profile=with-db：
#   ┌──────────────┐  ┌──────────────┐
#   │  postgres    │  │    redis     │
#   │   :5432      │  │    :6379     │
#   └──────────────┘  └──────────────┘
# ============================================================

services:
  # ============ 后端 API ============
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # 腾讯云镜像源（公网统一域名，VPC 内自动走内网，不消耗公网带宽）
        # 换到其他平台时改为 mirrors.aliyun.com / https://mirrors.aliyun.com/pypi/simple/
        APT_MIRROR: mirrors.cloud.tencent.com
        PIP_INDEX: https://mirrors.cloud.tencent.com/pypi/simple/
    image: self-evolving-kb-backend:${TAG:-latest}
    container_name: sekb-backend
    restart: unless-stopped
    # 日志标签：供 Promtail 通过 docker_sd 过滤采集
    labels:
      sekb-logs: backend
    ports:
      # 仅暴露给 frontend 容器内部网络；若需外部直连调试，取消下行注释
      - "8000:8000"
    environment:
      # ---- 必需密钥（运行时必须提供，stop/restart 时不强制）----
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      BOCHA_API_KEY: ${BOCHA_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      # ---- 可选 Tracing ----
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      # ---- 运行环境标记 ----
      ENVIRONMENT: production
      # HuggingFace 镜像（sentence-transformers 下载模型用，加速国内构建）
      HF_ENDPOINT: https://hf-mirror.com
    volumes:
      # 数据持久化：会话/索引/向量库/日志/trace 全部写入挂载卷
      - sekb_data:/app/data
      # 提示词模板（只读挂载，改提示词无需重建镜像）
      - ./prompt:/app/prompt:ro
    # 资源限制：保护单机不被单容器打爆
    # 注意：cpus 上限必须 ≤ 宿主机实际核数，否则容器无法启动
    # 2 核服务器推荐 "1.5"：给系统/SSH/frontend 预留 0.5 核，避免 backend 高峰时 SSH 卡顿
    # 4 核及以上服务器可放宽到 "3.0" ~ "4.0"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "1.5"
        reservations:
          memory: 1G
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      start_period: 60s   # 首次启动需要加载 embedding 模型，给予较长启动期
      retries: 3
    networks:
      - sekb_net
    # 优雅停止：等待 in-flight 请求完成
    stop_grace_period: 30s
    stop_signal: SIGTERM

  # ============ 前端 SPA + 反向代理 ============
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # npm 镜像源（淘宝源，国内通用）
        NPM_REGISTRY: https://registry.npmmirror.com
    image: self-evolving-kb-frontend:${TAG:-latest}
    container_name: sekb-frontend
    restart: unless-stopped
    # 日志标签：供 Promtail 采集 nginx 访问日志
    labels:
      sekb-logs: frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      # 挂载 nginx 配置：托管 SPA + 反向代理 /api 到 backend 容器
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 使用 127.0.0.1 避免 busybox wget 优先解析 localhost 为 IPv6 ::1 导致连接拒绝
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - sekb_net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ============ RSSHub（资讯日报鸿蒙/掘金/少数派等专属路由中转，内部服务）============
  # 公共 RSSHub 实例路由残缺且不稳定，故自建；仅 backend 内部访问，不对外暴露。
  rsshub:
    image: diygod/rsshub:latest
    container_name: sekb-rsshub
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # 内存缓存，降低对上游站点的请求频率
      CACHE_TYPE: memory
      # 监听端口（默认 1200）
      PORT: "1200"
    ports:
      # 仅绑定本机回环，供宿主机调试；backend 走容器网络 http://rsshub:1200
      - "127.0.0.1:1200:1200"
    networks:
      - sekb_net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ============ 可选：PostgreSQL（Phase 2 存储迁移后启用）============
  # 当前后端使用 local_json 存储，PostgreSQL 仅在迁移到 PG 后端时需要。
  # 通过 profile 控制：默认不启动，避免占用资源。
  postgres:
    image: postgres:16-alpine
    container_name: sekb-postgres
    restart: unless-stopped
    profiles: ["with-db"]
    environment:
      POSTGRES_USER: ${DB_USER:-sekb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-to-a-strong-db-password}
      POSTGRES_DB: ${DB_NAME:-sekb}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sekb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sekb_net
    deploy:
      resources:
        limits:
          memory: 1G

  # ============ 可选：Redis（Phase 2 L2 记忆迁移后启用）============
  # 当 L2 session memory 从本地内存迁移到 Redis 时启用。
  redis:
    image: redis:7-alpine
    container_name: sekb-redis
    restart: unless-stopped
    profiles: ["with-db"]
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sekb_net
    deploy:
      resources:
        limits:
          memory: 512M

# ============ 网络 ============
networks:
  sekb_net:
    driver: bridge
    name: sekb_network

# ============ 持久化卷 ============
volumes:
  # 后端所有运行时数据（会话/索引/向量库/日志/trace）
  sekb_data:
    name: sekb_data
  # PostgreSQL 数据（profile=with-db 时使用）
  pg_data:
    name: sekb_pg_data
  # Redis 数据（profile=with-db 时使用）
  redis_data:
    name: sekb_redis_data
